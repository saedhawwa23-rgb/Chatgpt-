name: Source migration

# Imports the existing Android application without replacing target workflow files.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-migration
    paths:
      - '.github/workflows/source-migration.yml'

permissions:
  contents: write

concurrency:
  group: source-migration-feature-source-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'saedhawwa23-rgb/Chatgpt-'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/source-migration
          fetch-depth: 0

      - name: Fetch existing Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Import once. Later workflow runs must preserve target-branch edits.
          if [ -f settings.gradle ] && [ -d app/src/main ]; then
            echo 'Android source is already present; preserving branch changes.'
            exit 0
          fi
          git clone --depth 1 --branch Chatgpt https://github.com/saedhawwa23-rgb/Usman-and-UMAR-automation-app-work-space-.git "$RUNNER_TEMP/source"
          rsync -a --exclude='.git' --exclude='.github/workflows/***' "$RUNNER_TEMP/source/" ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate existing Android source into target repository'
          git push origin HEAD:feature/source-migration

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android NDK ARM32 toolchain
        shell: bash
        run: |
          set -euo pipefail
          export NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang"
          command -v make
          command -v python3
          command -v readelf
          command -v file
          command -v curl
          echo "Using Android NDK: $NDK_PATH"

      - name: Cross-compile oonid/pr patched PRoot and PROOT_LOADER for ARM32
        shell: bash
        run: |
          set -euo pipefail
          # oonid/pr's source build emits both the patched proot executable and
          # its PROOT_LOADER using Android NDK clang (API 28), not ARM64 prebuilts.
          git clone --depth 1 https://github.com/oonid/pr.git /tmp/oonid-pr
          git -C /tmp/oonid-pr fetch --depth 1 origin 1b2ea7966b5105e7d58051a394c25da97bf85a7d
          git -C /tmp/oonid-pr checkout --quiet 1b2ea7966b5105e7d58051a394c25da97bf85a7d
          git config --global url."https://github.com/".insteadOf git@github.com:
          git -C /tmp/oonid-pr submodule update --init --depth 1 vendor/samba
          # Upstream build.sh uses the clang target triple for the NDK sysroot
          # directory too. NDK r27c stores ARM32 sysroot libraries under
          # arm-linux-androideabi, while the compiler driver is armv7a-...-clang.
          # Patch only this temporary checkout's sysroot-directory selection.
          python3 - <<'PY'
          from pathlib import Path
          script = Path("/tmp/oonid-pr/scripts/build.sh")
          source = script.read_text()
          old = '    cp -a "${ndk_sysroot}/usr/lib/${triple}" "${sysroot}/usr/lib/"'
          new = '''    local sysroot_triple="${triple}"
              if [ "${arch}" = "arm" ]; then
                  sysroot_triple="arm-linux-androideabi"
              fi
              cp -a "${ndk_sysroot}/usr/lib/${sysroot_triple}" "${sysroot}/usr/lib/"'''
          if old not in source:
              raise SystemExit("Expected upstream NDK sysroot line not found; refusing an unverified patch.")
          source = source.replace(old, new, 1)
          old_tls = 'fix_tls_alignment() {\n    local arch="$1"\n'
          new_tls = 'fix_tls_alignment() {\n    local arch="$1"\n    if [ "$arch" = "arm" ]; then\n        info "Skipping upstream ELF64-only TLS alignment patch for 32-bit ARM EABI"\n        return\n    fi\n'
          if old_tls not in source:
              raise SystemExit("Expected upstream TLS alignment function not found; refusing an unverified patch.")
          script.write_text(source.replace(old_tls, new_tls, 1))
          PY
          bash /tmp/oonid-pr/scripts/build.sh --arch=arm --ndk-path="$ANDROID_HOME/ndk/27.2.12479018"
          file /tmp/oonid-pr/build/out/arm/proot | tee /tmp/proot-file.txt
          grep -E 'ELF 32-bit.*ARM' /tmp/proot-file.txt
          test -s /tmp/oonid-pr/build/out/arm/loader
          file /tmp/oonid-pr/build/out/arm/loader | tee /tmp/proot-loader-file.txt
          grep -E 'ELF 32-bit.*ARM' /tmp/proot-loader-file.txt
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp /tmp/oonid-pr/build/out/arm/proot app/src/main/jniLibs/armeabi-v7a/libproot.so
          cp /tmp/oonid-pr/build/out/arm/loader app/src/main/jniLibs/armeabi-v7a/libproot-loader.so
          chmod 755 app/src/main/jniLibs/armeabi-v7a/libproot.so app/src/main/jniLibs/armeabi-v7a/libproot-loader.so
          mkdir -p app/src/main/assets
          proot_sha256="$(sha256sum app/src/main/jniLibs/armeabi-v7a/libproot.so | awk '{print $1}')"
          printf 'source=https://github.com/oonid/pr\ncommit=1b2ea7966b5105e7d58051a394c25da97bf85a7d\nsha256=%s\n' "$proot_sha256" > app/src/main/assets/proot-build.properties
          cat app/src/main/assets/proot-build.properties

      - name: Download and verify Alpine ARMv7 rootfs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location 'https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/armv7/alpine-minirootfs-3.24.2-armv7.tar.gz' -o /tmp/alpine-minirootfs-3.24.2-armv7.tar.gz
          printf '%s  %s\n' '5552f1ef2398cee46ef2cf733f8f1258f39a77ad065dfd47282fc0df9fe1976c' /tmp/alpine-minirootfs-3.24.2-armv7.tar.gz | sha256sum -c -

      - name: Verify requested zero-cost integrations
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'GOOGLE DRIVE HUB' app/src/main/java/com/opendroid/ai/ui/screens/SettingsScreen.kt
          grep -F 'ZERO-COST LOCAL PHONE TOOLS' app/src/main/java/com/opendroid/ai/ui/screens/SettingsScreen.kt
          grep -F 'SHARE_CONTENT' app/src/main/java/com/opendroid/ai/core/agent/ActionSchema.kt
          grep -F 'CLONE PUBLIC REPOSITORY' app/src/main/java/com/opendroid/ai/ui/screens/IntegratedTerminalScreen.kt
          grep -F 'INSTALL_OPEN_SOURCE_AGENTS' app/src/main/java/com/opendroid/ai/core/termux/TermuxIntegration.kt
          grep -F 'STOP_AGENT_JOBS' app/src/main/java/com/opendroid/ai/core/termux/TermuxIntegration.kt
          grep -F 'PROOT_LOADER' app/src/main/java/com/opendroid/ai/core/linux/LinuxRuntimeManager.kt
          grep -F 'suspend fun downloadUrl' app/src/main/java/com/opendroid/ai/core/storage/StorageWorkspaceProvider.kt
          grep -F 'COPY WORKSPACE OUTPUT TO DRIVE / FOLDER' app/src/main/java/com/opendroid/ai/ui/screens/SettingsScreen.kt
          grep -F 'DOWNLOAD DIRECTLY TO DRIVE / WORKSPACE' app/src/main/java/com/opendroid/ai/ui/screens/SettingsScreen.kt
          grep -F 'INSTALL OPENMANUS + OPENSWARM' app/src/main/java/com/opendroid/ai/ui/screens/IntegratedTerminalScreen.kt
          grep -F 'EXPORT LOG TO DRIVE' app/src/main/java/com/opendroid/ai/ui/screens/IntegratedTerminalScreen.kt
          test -s app/src/main/assets/install-agents-alpine.sh
          grep -F 'sha256=' app/src/main/assets/proot-build.properties

      - name: Run unit tests and build ARM32 debug APK
        run: ./gradlew -Dalpine.archive=/tmp/alpine-minirootfs-3.24.2-armv7.tar.gz testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Verify APK package and ARM32 ABI
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -E "package:|native-code"
          unzip -l "$apk" | grep -F 'lib/armeabi-v7a/libproot.so'
          unzip -l "$apk" | grep -F 'lib/armeabi-v7a/libproot-loader.so'
          file "$apk"
          echo "APK_PATH=$apk"
          echo "APK_SIZE_BYTES=$(stat -c '%s' "$apk")"
          echo "APK_SIZE_HUMAN=$(du -h "$apk" | cut -f1)"
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "APK_SHA256=$(cut -d ' ' -f1 app/build/outputs/apk/debug/SHA256SUMS.txt)"

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: usman-and-umar-debug-armv7
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
