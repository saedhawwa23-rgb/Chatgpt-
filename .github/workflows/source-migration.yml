name: Source migration

# Imports the existing Android application without replacing target workflow files.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/source-migration
    paths:
      - '.github/workflows/source-migration.yml'

permissions:
  contents: write

concurrency:
  group: source-migration-feature-source-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'saedhawwa23-rgb/Chatgpt-'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/source-migration
          fetch-depth: 0

      - name: Fetch existing Android source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Import once. Later workflow runs must preserve target-branch edits.
          if [ -f settings.gradle ] && [ -d app/src/main ]; then
            echo 'Android source is already present; preserving branch changes.'
            exit 0
          fi
          git clone --depth 1 --branch Chatgpt https://github.com/saedhawwa23-rgb/Usman-and-UMAR-automation-app-work-space-.git "$RUNNER_TEMP/source"
          rsync -a --exclude='.git' --exclude='.github/workflows/***' "$RUNNER_TEMP/source/" ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate existing Android source into target repository'
          git push origin HEAD:feature/source-migration

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ARM32 cross-compilation toolchain
        run: |
          sudo dpkg --add-architecture armhf
          sudo tee /etc/apt/sources.list.d/armhf-ports.list >/dev/null <<'EOF'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main universe
          EOF
          # Keep Ubuntu's amd64-only mirrors restricted to amd64. ARMHF packages
          # are served by ports.ubuntu.com, not security.ubuntu.com.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libseccomp-dev:armhf libtalloc-dev:armhf pkg-config

      - name: Build and package pinned ARM32 PRoot
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/termux/proot.git /tmp/proot
          git -C /tmp/proot checkout --quiet b8c1f5c5c6730dc9d521d5bd5ce1cfeedecde087
          make -C /tmp/proot/src -j"$(nproc)" CROSS_COMPILE=arm-linux-gnueabihf- CC=arm-linux-gnueabihf-gcc STRIP=arm-linux-gnueabihf-strip CFLAGS='-marm -DARM_cpsr=uregs[16] -DPSR_T_BIT=0x00000020' LDFLAGS="-static -ltalloc -Wl,-z,noexecstack"
          file /tmp/proot/src/proot | tee /tmp/proot-file.txt
          grep -E 'ELF 32-bit.*ARM.*EABI5.*statically linked' /tmp/proot-file.txt
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp /tmp/proot/src/proot app/src/main/jniLibs/armeabi-v7a/libproot.so
          chmod 755 app/src/main/jniLibs/armeabi-v7a/libproot.so

      - name: Download and verify Alpine ARMv7 rootfs
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location 'https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/armv7/alpine-minirootfs-3.24.2-armv7.tar.gz' -o /tmp/alpine-minirootfs-3.24.2-armv7.tar.gz
          printf '%s  %s\n' '5552f1ef2398cee46ef2cf733f8f1258f39a77ad065dfd47282fc0df9fe1976c' /tmp/alpine-minirootfs-3.24.2-armv7.tar.gz | sha256sum -c -

      - name: Run unit tests and build ARM32 debug APK
        run: ./gradlew -Dalpine.archive=/tmp/alpine-minirootfs-3.24.2-armv7.tar.gz testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Verify APK package and ARM32 ABI
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" | grep -E "package:|native-code"
          unzip -l "$apk" | grep -F 'lib/armeabi-v7a/libproot.so'
          sha256sum "$apk" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: usman-and-umar-debug-armv7
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
